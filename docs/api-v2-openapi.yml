openapi: 3.1.0
info:
  title: Meme Search API v2
  version: 2.0.0
  description: >-
    Write operations, officially supported on loopback. Reads stay in the
    read-only API v1 (search-api-openapi.yml); v2 adds uploads only.
  x-token-scopes: ["media:write"]
  x-support-boundary: loopback-only
  x-compatibility:
    changes: additive-only
servers:
  - url: http://127.0.0.1:3000
    description: Default loopback instance
security:
  - bearerAuth: []
paths:
  /api/v2/memes:
    post:
      summary: Upload one or more images into a library folder
      operationId: uploadMemes
      x-required-scope: media:write
      x-rate-limit:
        requests: 30
        window-seconds: 60
        key: authenticated-token
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ["files[]"]
              properties:
                "files[]":
                  description: Repeat the field once per file. Each file is at most 10 MB and a .jpg, .jpeg, .png, .webp, or .gif image.
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                folder:
                  description: Exact name of an existing library folder. Defaults to direct-uploads.
                  type: string
                generate_description:
                  description: Queue description generation (and then embeddings) for every created meme.
                  type: string
                  enum: ["true", "false"]
                  default: "false"
      responses:
        "200":
          description: One outcome per file; check created, duplicates, and errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: MemeSearchToken
  schemas:
    Meme:
      description: Same object as API v1 search results.
      type: object
      additionalProperties: true
      required: [id, filename, description, tags, media_type, content_url, folder, description_status]
      properties:
        id:
          type: integer
        filename:
          type: string
        description:
          type: [string, "null"]
        tags:
          type: array
          items:
            type: string
        media_type:
          type: string
        content_url:
          type: string
          pattern: "^/api/v1/memes/[1-9][0-9]*/content$"
        folder:
          type: string
          maxLength: 300
        description_status:
          type: string
          enum: [pending, ready, failed]
    CreatedFile:
      type: object
      additionalProperties: true
      required: [filename, description_queued, meme]
      properties:
        filename:
          description: The file name as sent by the client.
          type: string
        description_queued:
          type: boolean
        meme:
          $ref: "#/components/schemas/Meme"
    DuplicateFile:
      type: object
      additionalProperties: true
      required: [filename, meme]
      properties:
        filename:
          type: string
        meme:
          description: The meme that already has these bytes, or null when that file is not indexed yet.
          oneOf:
            - $ref: "#/components/schemas/Meme"
            - type: "null"
    FailedFile:
      type: object
      additionalProperties: true
      required: [filename, error]
      properties:
        filename:
          type: string
        error:
          type: object
          additionalProperties: true
          required: [code, message]
          properties:
            code:
              type: string
              enum: [file_too_large, unsupported_file_type, invalid_image, storage_failed]
            message:
              type: string
    UploadResponse:
      type: object
      additionalProperties: true
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: true
          required: [created, duplicates, errors]
          properties:
            created:
              type: array
              items:
                $ref: "#/components/schemas/CreatedFile"
            duplicates:
              type: array
              items:
                $ref: "#/components/schemas/DuplicateFile"
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FailedFile"
        meta:
          type: object
          additionalProperties: true
          required: [folder, generate_description]
          properties:
            folder:
              type: string
            generate_description:
              type: boolean
    ErrorResponse:
      type: object
      additionalProperties: true
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: true
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Bearer token lacks media:write
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: invalid_files, invalid_folder, or invalid_generate_description
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Per-token upload rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
